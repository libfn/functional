name: package-test-conan

on:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/package-test-conan.yml'
      - 'conanfile.py'
      - 'CMakeLists.txt'
      - 'cmake/**'
      - 'test_package/**'
      - 'include/**'
      - 'VERSION'
  pull_request:
    # Default types plus ready_for_review, so leaving draft runs what the draft gate skipped.
    types:
      - opened
      - synchronize
      - reopened
      - ready_for_review
    branches:
      - main
    paths:
      - '.github/workflows/package-test-conan.yml'
      - 'conanfile.py'
      - 'CMakeLists.txt'
      - 'cmake/**'
      - 'test_package/**'
      - 'include/**'
      - 'VERSION'
  workflow_dispatch:

jobs:
  test_conan_linux:
    if: github.event.pull_request.draft != true
    # arm64: the amd64 warp fleet pulls images at 1-2 MB/s; the arm64 fleet serves them in seconds
    runs-on: ${{ github.repository == 'libfn/functional' && 'warp-ubuntu-latest-arm64-2x' || 'ubuntu-latest' }}
    strategy:
      fail-fast: false
      matrix:
        mode: [cxx20, cxx26]
    container: libfn.azurecr.io/ci-build-gcc:16-sha-95f599d

    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

    - name: Detect Conan profile
      run: |
        conan profile detect
        echo "tools.cmake.cmaketoolchain:generator=Ninja" >> ~/.conan2/global.conf
        # Use the image's CMake to satisfy the recipe's tool requirement.
        printf '[platform_tool_requires]\ncmake/%s\n' "$(cmake --version | head -n1 | cut -d' ' -f3)" \
          >> "$(conan profile path default)"

    - name: Test packaging
      if: matrix.mode == 'cxx20'
      run: |
        conan create . --build=missing -s "compiler.cppstd=20"

    # The test package reads cxx26 to enable the second executable and check its output.
    - name: Test packaging (C++26 mode)
      if: matrix.mode == 'cxx26'
      run: |
        conan create . --build=missing -s "compiler.cppstd=26" -o "&:cxx26=True"

  test_conan_windows:
    if: github.event.pull_request.draft != true
    runs-on: ${{ github.repository == 'libfn/functional' && 'warp-windows-2025-vs2026-x64-8x' || 'windows-2025-vs2026' }}

    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

    - name: Install conan
      shell: pwsh
      run: pip install "conan<3"

    - name: Detect Conan profile
      shell: pwsh
      run: conan profile detect

    - name: Test packaging
      shell: pwsh
      run: conan create . --build=missing -s compiler.cppstd=20
