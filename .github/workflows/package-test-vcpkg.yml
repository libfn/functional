name: package-test-vcpkg

on:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/package-test-vcpkg.yml'
      - 'ports/**'
      - 'test_package/**'
      - 'include/**'
      - 'CMakeLists.txt'
      - 'cmake/**'
      - 'VERSION'
  pull_request:
    branches:
      - main
    paths:
      - '.github/workflows/package-test-vcpkg.yml'
      - 'ports/**'
      - 'test_package/**'
      - 'include/**'
      - 'CMakeLists.txt'
      - 'cmake/**'
      - 'VERSION'
  workflow_dispatch:

jobs:
  test_vcpkg_linux:
    runs-on: ${{ github.repository == 'libfn/functional' && 'warp-ubuntu-latest-x64-4x' || 'ubuntu-latest' }}

    steps:
    - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

    - name: Install libfn
      env:
        VCPKG_LIBFN_SOURCE_PATH: ${{ github.workspace }}
      run: |
        "$VCPKG_INSTALLATION_ROOT/vcpkg" install libfn \
          --overlay-ports=ports \
          --triplet x64-linux

    - name: Configure and build
      run: |
        cmake -B .build test_package \
          "-DCMAKE_TOOLCHAIN_FILE=$VCPKG_INSTALLATION_ROOT/scripts/buildsystems/vcpkg.cmake" \
          -DVCPKG_TARGET_TRIPLET=x64-linux
        cmake --build .build

    # main.cpp is a quine: the binary's stdout must reproduce the source exactly.
    - name: Run main
      run: .build/main | diff - test_package/src/main.cpp

  test_vcpkg_windows:
    runs-on: windows-2022

    steps:
    - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

    - name: Install libfn
      shell: pwsh
      env:
        VCPKG_LIBFN_SOURCE_PATH: ${{ github.workspace }}
        # vcpkg cleans the port build environment on Windows (POSIX inherits it),
        # so the source-path var must be kept explicitly for portfile.cmake to see it.
        VCPKG_KEEP_ENV_VARS: VCPKG_LIBFN_SOURCE_PATH
      run: |
        & "$env:VCPKG_INSTALLATION_ROOT\vcpkg" install libfn `
          --overlay-ports=ports `
          --triplet x64-windows

    - name: Configure and build
      shell: pwsh
      run: |
        cmake -B .build test_package -G "Visual Studio 17 2022" -A x64 `
          "-DCMAKE_TOOLCHAIN_FILE=$env:VCPKG_INSTALLATION_ROOT/scripts/buildsystems/vcpkg.cmake" `
          -DVCPKG_TARGET_TRIPLET=x64-windows
        cmake --build .build --config Release

    # main.cpp is a quine: the binary's stdout must reproduce the source exactly;
    # text-mode python normalizes \r\n on both sides of the comparison.
    - name: Run main
      shell: pwsh
      run: |
        python -c @'
        import subprocess
        out = subprocess.run([r".build\Release\main.exe"], capture_output=True, text=True, check=True).stdout
        src = open("test_package/src/main.cpp").read()
        if out != src:
            raise SystemExit("main.exe output differs from test_package/src/main.cpp")
        '@
