name: sonarcloud-pr-scan

# Runs after `sonarcloud.yml` completes on a pull_request event. Because this workflow is triggered by
# `workflow_run`, it executes in the context of the base repository's default branch and has access to
# repository secrets, including SONAR_TOKEN. This analyses every pull request, including those opened
# from forks, which otherwise do not receive secrets.
#
# The pull request head SHA is read from the artifact (written there by the triggering workflow from
# `github.event.pull_request.head.sha`) and used as the single source of truth for both the source
# checkout and the SonarCloud revision. Inside this workflow, `github.event.workflow_run.head_sha`
# is not suitable for either purpose because for `pull_request` events it is the synthetic merge commit
# SHA (`refs/pull/N/merge` rather than `refs/pull/N/head`), which is unreachable on the head branch
# and so is unsuitable for SCM status updates or PR decoration.

on:
  workflow_run:
    workflows: ["sonarcloud"]
    types: [completed]

permissions:
  contents: read
  actions: read
  pull-requests: write
  checks: write
  statuses: write

jobs:
  scan:
    # A job-level `if` cannot read `secrets`, so a fork that has not configured SonarCloud is filtered
    # out by the SONAR_PROJECT_KEY variable instead (the upstream repository always runs); SONAR_TOKEN
    # still gates every step below.
    if: >
      github.event.workflow_run.event == 'pull_request' &&
      github.event.workflow_run.conclusion == 'success' &&
      (github.repository == 'libfn/functional' || vars.SONAR_PROJECT_KEY != '')
    # arm64: the amd64 warp fleet pulls images at 1-2 MB/s; the arm64 fleet serves them in seconds
    # Runner and container must match sonarcloud.yml's: the compiler paths in the compile_commands.json
    # analysed below were recorded there, and must resolve to the same toolchain here.
    runs-on: ${{ github.repository == 'libfn/functional' && 'warp-ubuntu-latest-arm64-4x' || 'ubuntu-latest' }}
    container: libfn.azurecr.io/ci-build-gcc:15-sha-08b1133
    env:
      SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}

    steps:
    # Download the artifact outside the workspace so the subsequent checkout does not wipe it.
    - name: Download SonarCloud inputs artifact
      if: ${{ env.SONAR_TOKEN != '' }}
      uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
      with:
        name: sonarcloud-pr-inputs
        github-token: ${{ secrets.GITHUB_TOKEN }}
        run-id: ${{ github.event.workflow_run.id }}
        path: ${{ runner.temp }}/sonar-artifact

    # Trusted base checkout (default branch, since this runs via workflow_run) — provides
    # resolve-sonar-project and the artifact validation script. Plain, not sparse: sparse-checkout
    # forces a blob:none partial clone whose promisor filter the pull request checkout would inherit,
    # leaving SonarCloud's git blame unable to read historical blobs.
    - name: Check out base repository
      if: ${{ env.SONAR_TOKEN != '' }}
      uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

    - name: Resolve SonarCloud project
      id: sonar
      if: ${{ env.SONAR_TOKEN != '' }}
      uses: ./.github/actions/resolve-sonar-project
      with:
        organization: ${{ vars.SONAR_ORGANIZATION }}
        project-key: ${{ vars.SONAR_PROJECT_KEY }}

    - name: Validate artifact and read pull request metadata
      id: pr
      if: ${{ env.SONAR_TOKEN != '' }}
      shell: bash
      env:
        ARCHIVE: ${{ runner.temp }}/sonar-artifact/sonarcloud-pr-inputs.tar.gz
      run: bash .github/scripts/validate-pr-artifact.sh

    # Full history (fetch-depth 0): SonarCloud needs git blame for SCM attribution and new-code detection.
    - name: Check out pull request head
      if: ${{ env.SONAR_TOKEN != '' }}
      uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      with:
        ref: ${{ steps.pr.outputs.head_sha }}
        fetch-depth: 0

    # The checkout above replaced `.github` with the untrusted PR copy; remove `.github/actions` so no
    # local `./` action can run in this secrets-bearing job, then restore the build outputs from the
    # artifact (kept outside the workspace, so the checkout did not wipe it).
    - name: Neutralize local actions and restore build outputs
      if: ${{ env.SONAR_TOKEN != '' }}
      shell: bash
      env:
        ARCHIVE: ${{ runner.temp }}/sonar-artifact/sonarcloud-pr-inputs.tar.gz
      run: |
        rm -rf .github/actions
        rm -rf .build
        tar -xzf "$ARCHIVE" .build
        rm -f "$ARCHIVE"

    - name: Run SonarQube scan action
      if: ${{ env.SONAR_TOKEN != '' }}
      uses: SonarSource/sonarqube-scan-action@22918119ff8e1ca75a623e15c8296b6ea4fbe28f # v8.2.1
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      with:
        # Pin the host via -D (highest precedence) so a PR-controlled sonar-project.properties cannot
        # redirect SONAR_TOKEN to another host.
        args: >
          -Dsonar.host.url=https://sonarcloud.io
          -Dsonar.organization=${{ steps.sonar.outputs.organization }}
          -Dsonar.projectKey=${{ steps.sonar.outputs.project-key }}
          -Dsonar.cfamily.gcov.reportsPath=.build
          -Dsonar.cfamily.compile-commands=.build/compile_commands.json
          -Dsonar.scm.revision=${{ steps.pr.outputs.head_sha }}
          -Dsonar.pullrequest.key=${{ steps.pr.outputs.number }}
          -Dsonar.pullrequest.branch=${{ steps.pr.outputs.head_ref }}
          -Dsonar.pullrequest.base=${{ steps.pr.outputs.base_ref }}
