codecov:
  require_ci_to_pass: true

comment:
  behavior: default
  layout: reach,diff,flags,tree,reach
  show_carryforward_flags: false

coverage:
  range: "90..98"
  precision: 1
  round: nearest
  status:
    project:
      default:
        target: 99%
        threshold: 1%
    patch:
      default:
        target: auto
        threshold: 1%
    changes: false

github_checks:
  annotations: true

slack_app: false

parsers:
  cobertura:
    # Coverage is judged on lines, not branches (same intent as the gcov branch_detection block
    # below): without this, partially-taken branches on covered lines count against coverage.
    partials_as_hits: true
  gcov:
    branch_detection:
      conditional: false
      loop: false
      method: false
      macro: false

ignore:
  - "tests/"
  - "examples/"
